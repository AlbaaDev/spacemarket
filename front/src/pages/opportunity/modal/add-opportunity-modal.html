<h2 mat-dialog-title>Add opportunity</h2>
<form [formGroup]="opportunityAddForm" (ngSubmit)="onSubmitOpportunityForm()">
  <mat-dialog-content class="mat-typography">
    <mat-form-field appearance="fill">
      <mat-label>Business name</mat-label>
      <input id="businessName" type="text" formControlName="businessName" matInput placeholder="Placeholder">
      <mat-icon matSuffix></mat-icon>
      @if(businessName?.hasError('required') && businessName?.invalid && (businessName?.dirty || businessName?.touched))
      {
      <mat-error>
        Business name is required
      </mat-error>
      }
    </mat-form-field>
    <mat-form-field appearance="fill">
      <mat-label>Value</mat-label>
      <input id="value" type="text" formControlName="value" matInput placeholder="Placeholder">
      <mat-icon matSuffix></mat-icon>
      @if(value?.hasError('required') && value?.invalid && (value?.dirty || value?.touched)) {
      <mat-error>
        Value is required
      </mat-error>
      }
    </mat-form-field>
  </mat-dialog-content>
  <mat-dialog-actions>
    <button matButton mat-dialog-close>Cancel</button>
    <button matButton type="submit" [mat-dialog-close]="true"
      [disabled]="this.opportunityAddForm.invalid">Confirm</button>
  </mat-dialog-actions>
</form>
