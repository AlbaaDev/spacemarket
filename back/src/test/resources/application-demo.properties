# Profile added by TestBackApplication. Self-contained, so a fresh clone runs without the
# git-ignored application-dev.properties.

# Create the tables in the throwaway PostgreSQL, then fill them with the demo data of data.sql.
spring.jpa.hibernate.ddl-auto=create-drop
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# Demo-only signing key, generated for this throwaway setup. Never use it for real data.
jwt.secret=0ORmM7oD2dPkOLtQda1exHCQSAyqBCn1MdPn2mh1EjQx/wR1BdkV5+KxuvXJ7/A7
jwt.expiration=86400000

# Errors go only to Spotlight on this machine (npm run spotlight in front/, then
# http://localhost:8969). The DSN points at Spotlight itself: the Java SDK switches off without
# a DSN, and Spotlight accepts what a Sentry server would. Nothing reaches Sentry's servers.
sentry.dsn=http://spotlight@localhost:8969/0
sentry.send-default-pii=false
sentry.environment=dev
