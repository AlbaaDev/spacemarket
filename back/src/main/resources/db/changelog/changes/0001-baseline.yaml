- changeSet:
    id: 0001-baseline-enum-checks
    author: abi
    comment: Enum check constraints Hibernate creates; Liquibase Community does not capture them.
    dbms: postgresql
    changes:
    - sql:
        sql: >-
          ALTER TABLE contact_emails ADD CONSTRAINT contact_emails_type_check CHECK (type IN ('WORK', 'HOME'));
          ALTER TABLE contact_phones ADD CONSTRAINT contact_phones_type_check CHECK (type IN ('WORK', 'HOME'));
          ALTER TABLE custom_fields ADD CONSTRAINT custom_fields_target_check CHECK (target IN ('CONTACT', 'COMPANY', 'OPPORTUNITY'));
          ALTER TABLE custom_fields ADD CONSTRAINT custom_fields_type_check CHECK (type IN ('TEXT', 'NUMBER', 'DATE', 'SINGLE_CHOICE', 'CHECKBOX'));
          ALTER TABLE interactions ADD CONSTRAINT interactions_step_check CHECK (step IN ('HR', 'BUSINESS_MANAGER', 'CLIENT', 'CLIENT_TECHNICAL'));
          ALTER TABLE interactions ADD CONSTRAINT interactions_type_check CHECK (type IN ('CALL', 'EMAIL', 'MEETING', 'MESSAGE'));
          ALTER TABLE opportunities ADD CONSTRAINT opportunities_status_check CHECK (status IN ('OPEN', 'WON', 'LOST'));
