name: SpaceMarket Frontend CI/CD

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - front/**
pool:
  name: 'Newpool'

stages:
- stage: Deploy
  displayName: Build and Deploy to Azure SWA
  jobs:
  - job: DeployJob
    displayName: Deploy Angular
    steps:
    - checkout: self
      submodules: true

    # Build on the agent itself. The deploy task's own build runs in an x86_64 container, emulated on
    # this Apple Silicon agent, where npm install and ng build fail intermittently (ETXTBSY, out of memory).
    - script: npm ci && npm run build
      displayName: 'Build Angular'
      workingDirectory: front

    - task: AzureStaticWebApp@0
      displayName: 'Deploy SWA'
      inputs:
        app_location: '/front/dist/front/browser'
        api_location: ''
        output_location: ''
        skip_app_build: true
        skip_api_build: true
        azure_static_web_apps_api_token: $(SWA_TOKEN)